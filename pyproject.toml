[project]
name = "msw-da-ml"
version = "0.1.0"
description = "Reimplementation of the the Paper 'Training a convolutional neural network to conserve mass in data assimilation' and their associated code https://github.com/wavestoweather/MSW_DA_ML/tree/v2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cvxopt>=1.3.2",
    "matplotlib>=3.10.3",
    "numpy>=2.3.0",
    "pydantic>=2.11.5",
    "pydantic-settings[yaml]>=2.9.1",
    "pyyaml>=6.0.2",
    "ruff>=0.11.13",
    "typer>=0.16.0",
]
